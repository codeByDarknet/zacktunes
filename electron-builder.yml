appId: com.zack.zacktunes
productName: ZackTunes
copyright: Copyright © 2026 Abdoul Razack Ouedraogo
directories:
  buildResources: build
  output: dist
files:
  - '**/*'
  - '!resources/**'
  - '!dist/**'
  - '!build/**'
  - '!website/**'
  - '!.github/**'
  - '!electron-builder.yml'
  - '!mvp.md'
  - '!TEST.md'
  - '!download-ytdlp.js'
  - '!node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme}'
  - '!node_modules/*/{test,__tests__,tests,powered-test,example,examples}'
  - '!node_modules/*.d.ts'
  - '!node_modules/.bin'
  - '!**/*.{iml,o,hprof,orig,pyc,pyo,rbc,swp,csproj,sln,xproj}'
  - '!.editorconfig'
  - '!**/._*'
  - '!**/{.DS_Store,.git,.hg,.svn,CVS,RCS,SCCS,.gitignore,.gitattributes}'
  - '!**/{__pycache__,thumbs.db,.flowconfig,.idea,.vs,.nyc_output}'
  - '!**/{appveyor.yml,.travis.yml,circle.yml}'
  - '!**/{npm-debug.log,yarn.lock,.yarn-integrity,.yarn-metadata.json}'
asarUnpack:
  - node_modules/@fortawesome/**
# Noms de fichiers sans numéro de version : le site pointe vers
# https://github.com/codeByDarknet/zacktunes/releases/latest/download/<nom>
publish: null

# yt-dlp et ffmpeg sont embarqués dans les ressources de chaque plateforme.
# `node download-ytdlp.js` les récupère avant le build (voir README).
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  extraResources:
    - from: resources/yt-dlp.exe
      to: yt-dlp.exe
    - from: resources/ffmpeg.exe
      to: ffmpeg.exe
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ZackTunes
  artifactName: ZackTunes-Windows-Setup.${ext}

mac:
  category: public.app-category.music
  icon: build/icon.icns
  target:
    - target: dmg
      arch: [arm64, x64]
  extraResources:
    - from: resources/mac/yt-dlp
      to: yt-dlp
    - from: resources/mac/${arch}/ffmpeg
      to: ffmpeg
  artifactName: ZackTunes-macOS-${arch}.${ext}

linux:
  target:
    - target: deb
      arch: [x64]
    - target: AppImage
      arch: [x64]
  icon: build/icons
  category: AudioVideo
  executableName: zacktunes
  synopsis: Gestionnaire de musiques YouTube
  # Sous Linux, ffmpeg vient du système (dépendance du .deb)
  extraResources:
    - from: resources/yt-dlp
      to: yt-dlp
  desktop:
    Name: ZackTunes
    GenericName: Lecteur de musique
    Categories: AudioVideo;Audio;Player;
    Keywords: musique;youtube;mp3;audio;
    StartupWMClass: ZackTunes
  artifactName: ZackTunes-Linux-${arch}.${ext}
deb:
  artifactName: zacktunes_${arch}.${ext}
  depends:
    - ffmpeg
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
