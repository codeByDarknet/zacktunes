<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZackTunes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="node_modules/@fortawesome/fontawesome-free/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <h1 class="app-title">
                    <span class="logo-icon">
                        <i class="fas fa-music"></i>
                    </span>
                    <span class="title-text"><span class="title-black">Zack</span><span class="title-orange">Tunes</span></span>
                </h1>
            </div>
            <div class="header-right">
                <div class="add-music-section">
                    <input 
                        type="text" 
                        id="youtubeInput" 
                        placeholder="Coller un lien YouTube ici..."
                        class="youtube-input"
                    >
                    <button id="addMusicBtn" class="btn btn-primary">
                        <i class="fas fa-plus"></i> Ajouter
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Search Bar -->
            <div class="search-section">
                <div class="search-container">
                    <input 
                        type="text" 
                        id="searchInput" 
                        placeholder="Rechercher dans votre bibliothèque..."
                        class="search-input"
                    >
                    <button id="clearSearchBtn" class="btn btn-ghost search-clear">✕</button>
                </div>
                <div class="search-results">
                    <span id="searchResultsCount"></span>
                </div>
            </div>

            <!-- Library -->
            <div class="library-section">
                <div class="library-header">
                    <h2>Ma Bibliothèque</h2>
                    <button id="downloadAllBtn" class="btn btn-outline">
                        <i class="fas fa-download"></i> Télécharger tout
                    </button>
                </div>
                
                <div id="musicLibrary" class="music-grid">
                    <!-- Les musiques seront ajoutées ici dynamiquement -->
                </div>

                <div id="emptyState" class="empty-state">
                    <div class="empty-icon"><i class="fas fa-music fa-3x"></i></div>
                    <h3>Votre bibliothèque est vide</h3>
                    <p>Ajoutez votre première musique en collant un lien YouTube ci-dessus</p>
                </div>
            </div>
        </main>

        <!-- Audio Player -->
        <div id="audioPlayer" class="audio-player">
            <div class="player-info">
                <img id="playerThumbnail" src="" alt="" class="player-thumbnail">
                <div class="player-text">
                    <div id="playerTitle" class="player-title">Aucune musique</div>
                    <div id="playerArtist" class="player-artist">Sélectionnez une musique</div>
                </div>
            </div>
            
            <div class="player-controls">
                <button id="prevBtn" class="btn btn-ghost player-btn"><i class="fas fa-step-backward"></i></button>
                <button id="playPauseBtn" class="btn btn-primary player-btn-main"><i class="fas fa-play"></i></button>
                <button id="nextBtn" class="btn btn-ghost player-btn"><i class="fas fa-step-forward"></i></button>
            </div>
            
            <div class="player-progress">
                <span id="currentTime">0:00</span>
                <div class="progress-container">
                    <input type="range" id="progressBar" class="progress-bar" min="0" max="100" value="0">
                </div>
                <span id="totalTime">0:00</span>
            </div>
            
            <div class="player-volume">
                <i class="fas fa-volume-up"></i>
                <input type="range" id="volumeBar" class="volume-bar" min="0" max="100" value="70">
            </div>
            
            <audio id="audioElement" preload="metadata"></audio>
        </div>

        <!-- Toast Notifications -->
        <div id="toastContainer" class="toast-container"></div>

        <!-- Loading Overlay -->
        <div id="loadingOverlay" class="loading-overlay">
            <div class="loading-spinner"></div>
            <div id="loadingText" class="loading-text">Chargement...</div>
        </div>

        <!-- Confirmation Dialog -->
        <div id="confirmDialog" class="dialog-overlay">
            <div class="dialog">
                <div class="dialog-header">
                    <h3 id="dialogTitle">Confirmation</h3>
                </div>
                <div class="dialog-content">
                    <p id="dialogMessage">Êtes-vous sûr ?</p>
                    <div class="dialog-options">
                        <label>
                            <input type="checkbox" id="deleteAudioFile">
                            Supprimer aussi le fichier MP3 (si téléchargé)
                        </label>
                    </div>
                </div>
                <div class="dialog-actions">
                    <button id="dialogCancel" class="btn btn-ghost">Annuler</button>
                    <button id="dialogConfirm" class="btn btn-danger">Supprimer</button>
                </div>
            </div>
        </div>

        <!-- Lyrics Dialog -->
        <div id="lyricsDialog" class="dialog-overlay">
            <div class="dialog lyrics-dialog">
                <div class="dialog-header">
                    <h3 id="lyricsTitle">Paroles</h3>
                    <div style="display: flex; gap: 8px; align-items: center;">
                        <button id="translateBtn" class="btn btn-outline" style="padding: 6px 12px; font-size: 13px;">
                            <i class="fas fa-language"></i> Traduire en français
                        </button>
                        <button id="lyricsClose" class="btn btn-ghost" style="padding: 4px 8px;">✕</button>
                    </div>
                </div>
                <div class="dialog-content lyrics-content">
                    <div id="lyricsContent"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="youtube-utils.js"></script>
    <script src="file-utils.js"></script>
    <script src="app.js"></script>
</body>
</html>
